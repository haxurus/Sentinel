name: Bootstrap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct repository source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | tr -d '\n' | base64 -d > /tmp/sentinel-source.tar.gz
          tar -tzf /tmp/sentinel-source.tar.gz >/dev/null
          tar -xzf /tmp/sentinel-source.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Sentinel v0.3.0"
          git push origin HEAD:main
