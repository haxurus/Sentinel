name: Bug report
description: Something in Sentinel does not work as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        - **Security vulnerability?** Do not open a public issue: use [private vulnerability reporting](https://github.com/haxurus/Sentinel/security/advisories/new).
        - **Question or help with setup?** Ask in the [Discord server](https://discord.gg/DDBGWP5fMX).
        - Never paste tokens, passwords, `.env` files, database dumps or other people's messages.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/haxurus/Sentinel/issues?q=is%3Aissue) and this has not been reported yet.
          required: true
        - label: This report contains no secrets, tokens or personal data of other users.
          required: true
  - type: dropdown
    id: instance
    attributes:
      label: Where does it happen?
      options:
        - Hosted instance (sentinel.haxurus.com)
        - Self-hosted instance
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bot — logs in Discord (missing, wrong or late)
        - Dashboard — server settings, loggers, history, export
        - Plans and limits
        - Website — home, pricing, legal pages
        - Self-hosting — Docker, deployment, migrations
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem. Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the "Message deleted" logger
        2. Delete a message in #general
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: Logger / event key
      description: If the problem concerns a specific logger, its key as shown in the dashboard (e.g. `message.delete`).
  - type: input
    id: delivery
    attributes:
      label: Delivery state in the history
      description: The state shown next to the event in Dashboard → History (e.g. `SENT`, `FILTERED`, `CHANNEL_UNAVAILABLE`, `FAILED`).
  - type: input
    id: version
    attributes:
      label: Version (self-hosted only)
      description: Commit SHA or image digest you are running.
  - type: textarea
    id: context
    attributes:
      label: Screenshots, logs and environment
      description: Browser and operating system for dashboard issues; redacted logs for self-hosting issues. You can drag images here.
